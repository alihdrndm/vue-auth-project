name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LLM_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eingang
          POSTGRES_USER: eingang
          POSTGRES_PASSWORD: eingang
        ports:
          - 5452:5432
        options: >-
          --health-cmd "pg_isready -U eingang -d eingang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eingang:eingang@localhost:5452/eingang
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --extra worker
      - name: Lint
        run: uv run poe lint
      - name: Typecheck
        run: uv run poe typecheck
      # The pinned ZUGFeRD corpus (about 150 MB) is downloaded once and cached by its commit.
      - name: Cache the ZUGFeRD corpus
        uses: actions/cache@v4
        with:
          path: data/corpus
          key: zugferd-corpus-d891458e9822e34271a5438497bf924e89955979
      - name: Fetch the ZUGFeRD corpus
        run: uv run poe fetch-corpus
      - name: Test
        run: uv run poe test
      - name: OpenAPI freshness
        run: uv run poe openapi-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install backend dependencies (for the OpenAPI export)
        working-directory: backend
        run: uv sync --frozen --extra worker
      - name: Lint
        run: pnpm --filter frontend lint
      - name: Typecheck
        run: pnpm --filter frontend typecheck
      - name: Unit tests
        run: pnpm --filter frontend test
      - name: Generated API types freshness
        run: node scripts/gen-api.mjs --check
      - name: Build
        run: pnpm --filter frontend build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Smoke tests
        run: pnpm test:e2e
