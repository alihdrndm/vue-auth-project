[project]
name = "eingang-backend"
version = "0.1.0"
description = "Eingang backend: Django API, Temporal worker and the einvoice library."
authors = [{ name = "Ali Haider Nadeem" }]
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.110",
    "defusedxml>=0.7.1",
    "django>=6,<7",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "lxml>=6.1.3",
    "openai>=3.27.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "python-stdnum>=2.2",
    "rapidfuzz>=3.14.6",
    "temporalio>=1.34.0",
    "uuid-utils>=1.0.0",
]

[project.optional-dependencies]
worker = [
    "factur-x>=7.4",
    "pdfplumber>=0.11.10",
    "pypdf>=6.20.0",
    "saxonche>=13.0.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pillow>=12.3.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "reportlab>=5.0.1",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-defusedxml>=0.7.0.20260504",
    "types-reportlab>=5.0.0.20261008",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "DTZ", "PT", "N", "DJ"]
# DJ001: the spec stores "not set" as NULL (vat_id, due dates, ...), mirroring None in the
# canonical model; "" and NULL must stay distinguishable. See docs/DECISIONS.md.
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
# N802: test names carry spec IDs in their original case (test_D1_..., test_C01_...).
"tests/**" = ["S101", "N802"]
# Generated by makemigrations.
"**/migrations/*" = ["RUF012", "E501"]

[tool.mypy]
strict = true
# ".." makes the repository-root package `evals` importable for the type checker.
mypy_path = "src,.."
files = ["src", "tests", "tools", "../evals"]
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

# factur-x and saxonche ship no type information; see docs/DECISIONS.md.
[[tool.mypy.overrides]]
module = ["facturx", "facturx.*", "saxonche", "saxonche.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "eingang.settings"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "eingang.settings"
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-report=json"

[tool.poe.tasks]
lint = ["_ruff-check", "_ruff-format-check", "_lint-imports"]
format = ["_ruff-format", "_ruff-fix"]
typecheck = "mypy"
test = ["_pytest", "_check-coverage"]
_pytest = "pytest"
_check-coverage = "python tools/check_coverage.py"
api = "python manage.py runserver 127.0.0.1:8010"
fetch-corpus = "python tools/fetch_corpus.py"
fetch-rules = "python tools/fetch_rules.py"
build-samples = "python tools/build_samples.py"
llm-smoke = "python tools/llm_smoke.py"
precompute-samples = "python tools/precompute_samples.py"
create-org = "python manage.py create_org"
seed-rules = "python manage.py seed_rules"
ensure-schedules = "python manage.py ensure_schedules"
llm-spend = "python manage.py llm_spend"
openapi = "python tools/export_openapi.py"
openapi-check = "python tools/export_openapi.py --check"
worker = { cmd = "python -m eingang.worker", env = { PYTHONPATH = "src" } }
# The evaluation scripts are modules of the repository-root package `evals` (see evals/__init__.py).
eval-dataset = { cmd = "python -m evals.build_dataset", env = { PYTHONPATH = ".." } }
_ruff-check = "ruff check . ../evals"
_ruff-format-check = "ruff format --check . ../evals"
_lint-imports = { cmd = "lint-imports", env = { PYTHONPATH = "src" } }
_ruff-format = "ruff format . ../evals"
_ruff-fix = "ruff check --fix . ../evals"
