  <div style="display:grid;gap:32px">
    <div style="display:flex;align-items:center;gap:16px"><span aria-hidden="true" style="width:1em;height:1em;font-size:56px;display:grid;place-items:center;border:0.0625em solid #2c4a8a;border-radius:0.15em;outline:0.025em solid #2c4a8a;outline-offset:-0.175em;background:#fffdf9;color:#2c4a8a;font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1;filter:url(#eg-ink)"><span style="font-size:0.55em">E</span></span><span style="font:700 56px/1 'Familjen Grotesk',sans-serif;letter-spacing:-0.025em;color:#1f1c18">Eingang</span></div>
    <h1 style="font:700 48px/1.08 'Familjen Grotesk',sans-serif;letter-spacing:-0.025em;color:#1f1c18;text-wrap:balance">Every supplier invoice in one inbox: checked, explained, approved.</h1>
    <p style="font-size:20px;color:#5f574d">Open source · XRechnung · ZUGFeRD · EN 16931</p>
  </div>
  <div style="display:grid;place-items:center;height:360px;background:#fdfaf4;border-radius:12px;box-shadow:0 1px 0 #3a2a140f, 0 30px 60px -34px #3a2a1470, 0 2px 6px -2px #3a2a1426">

  </div>
</div>
